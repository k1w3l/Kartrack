services:
  db:
    image: mysql:8.4
    restart: always
    container_name: kartrack_db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-kartrack}
      MYSQL_USER: ${DB_USER:-kartrack}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
      TZ: America/Sao_Paulo
    # Porta exposta apenas no localhost (acesso administrativo). Remova esta seção
    # em produção se não precisar acessar o banco diretamente do host.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build: .
    image: kiwel/kartrack:latest
    restart: always
    container_name: kartrack
    env_file:
      - .env
    environment:
      DB_HOST: db
      TZ: America/Sao_Paulo
    volumes:
      - ./uploads/vehicles:/app/uploads/vehicles
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
